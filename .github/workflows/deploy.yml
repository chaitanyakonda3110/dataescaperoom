name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write real Lock answers from repo secret
        env:
          LOCKS_CONFIG_JSON: ${{ secrets.LOCKS_CONFIG_JSON }}
        run: |
          if [ -z "$LOCKS_CONFIG_JSON" ]; then
            echo "::error::LOCKS_CONFIG_JSON repository secret is not set. See README.md section 4."
            exit 1
          fi
          printf 'export const LOCKS = %s;\n' "$LOCKS_CONFIG_JSON" > src/config/locks.js

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
